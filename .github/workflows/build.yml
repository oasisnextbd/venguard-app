# Builds, tests and publishes the VenGuard app.
#   Pull requests: typecheck, unit tests, web build, Android debug build.
#   main:          the same, then publishes https://oasisnextbd.github.io/venguard-app/
#                  with the Android app at …/VenGuard.apk and the in-app update at …/updates/
#                  (latest.json + bundle zip; installed apps fetch it, see src/lib/updates.ts)
#   Tags v*:       also attaches the APK to a GitHub Release.
name: Build and publish app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # In-app update: the same web build as a zip, made before the APK and before anything else
      # lands in dist/. Published in the last step, after the APK is built.
      - name: Package the in-app update
        run: |
          cd dist && zip -qr "$RUNNER_TEMP/bundle.zip" . && cd ..
          # The updater (6.x) checks a CRC32 of the zip; the download itself is HTTPS from this site.
          echo "BUNDLE_CHECKSUM=$(python3 -c "import sys, zlib; print('%08x' % (zlib.crc32(open(sys.argv[1], 'rb').read()) & 0xffffffff))" "$RUNNER_TEMP/bundle.zip")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy the web build into the Android project
        run: npx cap sync android

      - name: Prepare release signing (only if the secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build the Android app
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export VERSION_NAME="$(node -p "require('../package.json').version")"
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../dist/VenGuard.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/VenGuard.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: VenGuard-apk
          path: dist/VenGuard.apk

      - name: Add the in-app update to the site
        run: |
          mkdir -p dist/updates
          mv "$RUNNER_TEMP/bundle.zip" "dist/updates/bundle-${GITHUB_RUN_NUMBER}.zip"
          node -e '
            const pkg = require("./package.json");
            const n = Number(process.env.GITHUB_RUN_NUMBER);
            const m = { version: pkg.version, build: n, minNative: pkg.venguard.minNative, checksum: process.env.BUNDLE_CHECKSUM,
              url: `https://oasisnextbd.github.io/venguard-app/updates/bundle-${n}.zip` };
            require("fs").writeFileSync("dist/updates/latest.json", JSON.stringify(m, null, 2));
            console.log(m);'

      # The same files also go to Cloudflare Pages (project "venguard-app", address app.venguard.tech),
      # using the repository secrets CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
      # Skipped when the secrets are missing. GitHub Pages stays on until every installed app fetches
      # its updates from app.venguard.tech (see UPDATE_ORIGIN in src/lib/updatePolicy.ts).
      - name: Publish to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "No Cloudflare secrets: skipped"; exit 0; fi
          npx --yes wrangler@4 pages project create venguard-app --production-branch main \
            || echo "Project venguard-app already exists"
          npx --yes wrangler@4 pages deploy dist --project-name venguard-app --branch main --commit-dirty=true

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VenGuard.apk

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
